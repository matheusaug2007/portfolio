<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Matheus Augusto</title>
  <meta name="description" content="A página que você procura não existe ou foi movida." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#090a0f" />
  <link rel="icon" type="image/webp" href="/imagens/favicon/favicon.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(60rem 30rem at 15% -10%, rgba(0, 102, 255, 0.22), transparent 60%),
        radial-gradient(50rem 28rem at 100% 110%, rgba(0, 102, 255, 0.14), transparent 60%),
        #090a0f;
    }

    main { text-align: center; max-width: 520px; }

    .code {
      font-size: clamp(5.5rem, 22vw, 9rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #4f8dff 0%, #0066ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 { margin-top: 12px; font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 600; }

    p { margin-top: 12px; color: #94a3b8; line-height: 1.6; }

    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 26px;
      border-radius: 999px;
      background: #0066ff;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover { background: #0052cc; transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid #4f8dff; outline-offset: 3px; }

    .logo { margin-bottom: 28px; font-weight: 700; color: #fff; text-decoration: none; }
    .logo span { color: #0066ff; }
  </style>
</head>

<body>
  <main>
    <a href="/" class="logo">Matheus<span>.</span>dev</a>
    <div class="code" aria-hidden="true">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Que tal voltar para o início e ver meus projetos?</p>
    <a href="/" class="btn">Voltar para o início</a>
  </main>
</body>

</html>
